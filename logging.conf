# ============================================================
# 🏨 DOWNTOWN VILLA — LOGGING CONFIG
# ============================================================
# Optional. If absent, basicConfig is used.
# ============================================================

[loggers]
keys=root,downtown,pyrogram

[handlers]
keys=console,file

[formatters]
keys=standard

[formatter_standard]
format=%(asctime)s | %(levelname)-8s | %(name)-28s | %(message)s
datefmt=%H:%M:%S

[logger_root]
level=INFO
handlers=console,file

[logger_downtown]
level=INFO
handlers=console,file
qualname=downtown
propagate=0

[logger_pyrogram]
level=WARNING
handlers=console
qualname=pyrogram
propagate=0

[handler_console]
class=StreamHandler
level=INFO
formatter=standard
args=(sys.stdout,)

[handler_file]
class=handlers.RotatingFileHandler
level=INFO
formatter=standard
args=('logs/bot.log','a',10485760,5,'utf-8')
